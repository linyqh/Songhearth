[package]
name = "songhearth"
version = "0.1.0"
description = "Local music generation desktop client powered by audio.cpp"
edition = "2021"

[lib]
name = "songhearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
hound = "3"
# Decodes user-supplied reference songs (mp3/flac/m4a/ogg/wav) for cover jobs.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac"] }
anyhow = "1"

# Engine auto-download: audio.cpp ships .tar.gz on macOS and .zip on Windows.
[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# Stripping proc-macro dylibs breaks dlopen on macOS 27 ("mis-aligned
# LINKEDIT string pool"); only the final binary is stripped.
[profile.release.build-override]
strip = false
