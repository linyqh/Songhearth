[package]
name = "songhearth"
version = "0.1.0"
description = "Local music generation desktop client powered by audio.cpp"
edition = "2021"

[lib]
name = "songhearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
tar = "0.4"
hound = "3"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Stripping proc-macro dylibs breaks dlopen on macOS 27 ("mis-aligned
# LINKEDIT string pool"); only the final binary is stripped.
[profile.release.build-override]
strip = false
